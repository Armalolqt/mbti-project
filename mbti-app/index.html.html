<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>16人格 · 心智觉醒阶段测试</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --ink:#1a241a; --mid:#3a5a3a; --soft:#6b8c6b; --faint:#a8c8a8;
  --cream:#fafaf8; --shadow:rgba(45,106,79,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.screen{display:none;min-height:100vh;}
.screen.active{display:block;}

/* INTRO */
#intro{background:linear-gradient(170deg,#0e1a10 0%,#1e3a28 40%,#2d6a4f 80%,#40916c 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 24px 48px;text-align:center;position:relative;overflow:hidden;}
#intro.active{display:flex;}
.i-bg{position:absolute;inset:0;pointer-events:none;}
.i-eyebrow{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,0.5);margin-bottom:16px;font-family:'Noto Serif SC',serif;}
.i-title{font-family:'Noto Serif SC',serif;font-size:30px;font-weight:900;color:white;line-height:1.2;margin-bottom:12px;letter-spacing:2px;}
.i-sub{font-size:13px;color:rgba(255,255,255,0.55);line-height:1.9;margin-bottom:32px;}
.i-stage-row{display:flex;gap:8px;margin-bottom:36px;justify-content:center;flex-wrap:wrap;}
.i-stage{padding:7px 12px;border-radius:12px;font-size:11px;font-weight:600;border:1px solid;}
.is-0{background:rgba(107,125,179,0.2);border-color:rgba(107,125,179,0.4);color:#a8b8e8;}
.is-1{background:rgba(200,146,42,0.2);border-color:rgba(200,146,42,0.4);color:#e8c870;}
.is-2{background:rgba(74,154,106,0.2);border-color:rgba(74,154,106,0.4);color:#90d0a8;}
.is-3{background:rgba(45,106,79,0.3);border-color:rgba(116,198,157,0.5);color:#a8e8c8;}
.i-stage-lbl{font-size:9px;display:block;margin-top:2px;opacity:0.7;font-weight:400;}
.btn-go{width:100%;max-width:300px;padding:17px;background:white;color:#2d6a4f;border:none;border-radius:16px;font-size:16px;font-weight:700;font-family:'Noto Serif SC',serif;cursor:pointer;letter-spacing:1px;box-shadow:0 10px 32px rgba(0,0,0,0.3);position:relative;z-index:2;}
.i-note{margin-top:14px;font-size:11px;color:rgba(255,255,255,0.3);}

/* TYPE SELECT */
#typesel{background:var(--cream);padding-bottom:100px;}
.tsel-head{padding:28px 20px 22px;color:white;background:linear-gradient(135deg,#1e3a28,#2d6a4f);}
.tsel-title{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;margin-bottom:6px;}
.tsel-sub{font-size:12px;opacity:0.7;}
.tsel-body{padding:20px 16px;}
.tgrp{margin-bottom:18px;}
.tgrp-label{font-size:10px;letter-spacing:2px;color:var(--soft);margin-bottom:10px;font-weight:500;}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.tbtn{padding:14px 4px;background:white;border:1.5px solid #e0eee0;border-radius:13px;font-size:13px;font-weight:700;color:var(--mid);cursor:pointer;text-align:center;transition:all 0.15s;font-family:'Noto Sans SC',sans-serif;line-height:1.3;}
.tbtn small{display:block;font-size:9px;font-weight:400;color:var(--faint);margin-top:2px;}
.tbtn.sel{border-color:#2d6a4f;background:#f0faf2;color:#2d6a4f;}
.tconfirm{position:fixed;bottom:0;left:0;right:0;padding:14px 20px 30px;background:white;border-top:1px solid #e8f0e8;z-index:20;}
.tsel-show{text-align:center;font-size:12px;color:var(--soft);margin-bottom:10px;height:16px;}
.btn-confirm{width:100%;padding:15px;background:#2d6a4f;color:white;border:none;border-radius:14px;font-size:16px;font-weight:600;font-family:'Noto Serif SC',serif;cursor:pointer;opacity:0.4;pointer-events:none;transition:opacity 0.2s;}
.btn-confirm.on{opacity:1;pointer-events:auto;}

/* QUIZ */
#quiz{background:var(--cream);}
.qbar{background:linear-gradient(135deg,#1e3a28,#2d6a4f);padding:18px 20px 16px;position:sticky;top:0;z-index:10;}
.qbar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.qprog{font-size:12px;color:rgba(255,255,255,0.7);}
.qskip{font-size:11px;color:rgba(255,255,255,0.45);background:rgba(255,255,255,0.1);padding:4px 10px;border-radius:10px;cursor:pointer;}
.ptrack{height:4px;background:rgba(255,255,255,0.2);border-radius:2px;overflow:hidden;}
.pfill{height:100%;background:#74c69d;border-radius:2px;transition:width 0.5s cubic-bezier(.4,0,.2,1);}
.qdtag{display:inline-block;margin-top:9px;font-size:10px;color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.1);padding:3px 10px;border-radius:9px;}
.qbody{padding:26px 20px;}
.qserial{font-size:10px;letter-spacing:2px;color:#40916c;margin-bottom:8px;}
.qtext{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:600;color:var(--ink);line-height:1.65;margin-bottom:28px;}
.opts{display:flex;flex-direction:column;gap:11px;}
.opt{padding:15px 16px;background:white;border:1.5px solid #e0eee0;border-radius:13px;font-size:14px;color:var(--mid);cursor:pointer;display:flex;align-items:center;gap:12px;transition:all 0.18s;box-shadow:0 1px 6px var(--shadow);font-family:'Noto Sans SC',sans-serif;}
.odot{width:26px;height:26px;min-width:26px;border-radius:50%;background:#f0faf2;border:1.5px solid #c8e8c8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--soft);transition:all 0.18s;}
.opt.sel{border-color:#40916c;background:#f0faf2;color:#2d6a4f;}
.opt.sel .odot{background:#2d6a4f;border-color:#2d6a4f;color:white;}

/* LOADING */
#loading{background:linear-gradient(160deg,#0e1a10 0%,#1e3a28 50%,#2d6a4f 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;}
#loading.active{display:flex;}
.lorb{width:96px;height:96px;border-radius:50%;background:rgba(116,198,157,0.1);border:2px solid rgba(116,198,157,0.3);display:flex;align-items:center;justify-content:center;font-size:46px;margin-bottom:28px;animation:lp 2.2s ease-in-out infinite;}
@keyframes lp{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
.ltitle{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:600;color:white;margin-bottom:10px;}
.lsub{font-size:13px;color:rgba(255,255,255,0.55);line-height:1.9;margin-bottom:36px;}
.lsteps{width:100%;max-width:260px;}
.lstep{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;color:rgba(255,255,255,0.35);transition:color 0.5s;}
.lstep.done{color:rgba(255,255,255,0.9);}
.ldot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.15);flex-shrink:0;transition:background 0.5s;}
.lstep.done .ldot{background:#74c69d;}

/* REPORT */
#report{padding-bottom:56px;}
.rhero{padding:30px 20px 32px;color:white;position:relative;overflow:hidden;}
.rhero-bg{position:absolute;inset:0;}
.rhero-bg::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,0.06);}
.rhero-bg::after{content:'';position:absolute;bottom:-40px;left:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,0.04);}
.rhero-content{position:relative;z-index:2;}
.rhero-top{display:flex;align-items:center;gap:18px;margin-bottom:20px;}
.sring{position:relative;width:86px;height:86px;flex-shrink:0;}
.sring svg{transform:rotate(-90deg);}
.sring-inner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.snum{font-family:'Noto Serif SC',serif;font-size:24px;font-weight:900;color:white;line-height:1;display:block;}
.slbl{font-size:9px;color:rgba(255,255,255,0.65);display:block;margin-top:2px;}
.stage-big{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:12px;font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);margin-bottom:8px;}
.sdots{display:flex;gap:4px;margin-top:4px;}
.sdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.3);}
.sdot.on{background:white;}
.hero-type{font-size:13px;color:rgba(255,255,255,0.8);margin-bottom:6px;}
.hero-tags{display:flex;gap:6px;flex-wrap:wrap;}
.htag{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:12px;padding:3px 10px;font-size:10px;color:rgba(255,255,255,0.9);}
.hero-motto{font-family:'Noto Serif SC',serif;font-size:13px;color:rgba(255,255,255,0.7);line-height:1.8;border-top:1px solid rgba(255,255,255,0.15);padding-top:16px;font-style:italic;}
.rcard{background:white;border-radius:20px;margin:12px 14px 0;box-shadow:0 2px 16px var(--shadow);border:1px solid rgba(200,235,200,0.5);overflow:hidden;}
.rcard-hd{padding:16px 18px 14px;border-bottom:1px solid #f0f8f0;display:flex;align-items:center;gap:10px;}
.rcard-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.rcard-title{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:700;color:var(--ink);flex:1;}
.rcard-sub{font-size:11px;color:var(--faint);}
.radar-wrap{padding:20px 12px 16px;}
.spath{padding:18px;}
.spath-nodes{display:flex;align-items:flex-start;margin-bottom:16px;}
.snode{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;}
.snode-circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid;transition:all 0.3s;font-family:'Noto Sans SC',sans-serif;}
.snode-circle.cur{transform:scale(1.18);box-shadow:0 4px 16px rgba(0,0,0,0.15);}
.snode-name{font-size:9.5px;color:var(--soft);font-weight:500;}
.sarrow{font-size:14px;color:#ccc;flex-shrink:0;margin-bottom:20px;padding:0 2px;}
.sdesc-box{background:#f0faf2;border-radius:14px;padding:14px 16px;margin-bottom:12px;border:1px solid rgba(116,198,157,0.3);}
.sdesc-lbl{font-size:10px;font-weight:700;color:#40916c;letter-spacing:1px;margin-bottom:6px;}
.sdesc-txt{font-size:13px;color:var(--mid);line-height:1.8;}
.sadv-box{background:linear-gradient(135deg,#f0faf2,#e0f5e8);border-radius:14px;padding:14px 16px;border-left:3px solid #40916c;}
.sadv-lbl{font-size:10px;font-weight:700;letter-spacing:1px;margin-bottom:6px;}
.sadv-txt{font-size:13px;color:var(--mid);line-height:1.8;font-family:'Noto Serif SC',serif;}
.irdg-pad{padding:16px 18px;}
.irdg-txt{font-size:13px;color:var(--mid);line-height:1.85;background:#f0faf2;border-radius:12px;padding:14px;border:1px solid rgba(116,198,157,0.25);}
.shadow-pad{padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
.shadow-lt{background:#f0faf2;border-radius:14px;padding:14px;border:1px solid rgba(116,198,157,0.3);}
.shadow-dk{background:#fff5f5;border-radius:14px;padding:14px;border:1px solid rgba(220,100,100,0.15);}
.shadow-title{font-size:11px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.shadow-title.lt{color:#2d6a4f;}
.shadow-title.dk{color:#b05050;}
.shadow-body{font-size:12.5px;color:var(--mid);line-height:1.85;margin-bottom:10px;}
.stags{display:flex;flex-wrap:wrap;gap:5px;}
.stag{font-size:10px;padding:3px 9px;border-radius:9px;}
.stag.lt{background:rgba(116,198,157,0.2);color:#2d6a4f;}
.stag.dk{background:rgba(220,100,100,0.12);color:#b05050;}
.career-pad{padding:14px 18px 18px;display:flex;flex-direction:column;gap:2px;}
.career-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f8f0;}
.career-row:last-child{border-bottom:none;}
.crank{width:22px;height:22px;border-radius:50%;background:#f0faf2;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(116,198,157,0.4);}
.cname{font-size:13px;font-weight:500;color:var(--ink);flex:1;}
.cbar-w{width:90px;}
.cbar-bg{height:6px;background:#e8f4e8;border-radius:3px;overflow:hidden;}
.cbar-fill{height:100%;border-radius:3px;}
.cpct{font-size:10px;font-weight:600;margin-top:2px;text-align:right;}
.match-pad{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;}
.match-row{display:flex;align-items:center;gap:10px;}
.mtype{font-size:13px;font-weight:700;color:var(--ink);width:50px;flex-shrink:0;}
.mbar-bg{flex:1;height:8px;background:#e8f4e8;border-radius:4px;overflow:hidden;}
.mbar-fill{height:100%;border-radius:4px;}
.mpct{font-size:11px;font-weight:700;width:34px;text-align:right;}
.mnote{font-size:11px;color:var(--soft);padding:6px 10px;background:#f0faf2;border-radius:10px;line-height:1.6;}
.growth-pad{padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
.gitem{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:#fafdf8;border-radius:13px;border:1px solid #e4f4e4;}
.gnum{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;flex-shrink:0;margin-top:1px;}
.gtext{font-size:12.5px;color:var(--mid);line-height:1.7;}
.ai-pad{padding:16px 18px 20px;}
.ai-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;margin-bottom:10px;display:flex;align-items:center;gap:5px;}
.ai-body{font-family:'Noto Serif SC',serif;font-size:13.5px;color:var(--mid);line-height:2;background:#f0faf2;border-radius:14px;padding:16px;border:1px solid rgba(116,198,157,0.3);}
.rbot{padding:22px 14px 20px;display:flex;flex-direction:column;gap:10px;}
.btn-share{padding:16px;color:white;border:none;border-radius:15px;font-size:15px;font-weight:600;font-family:'Noto Serif SC',serif;cursor:pointer;letter-spacing:1px;box-shadow:0 8px 24px rgba(45,106,79,0.35);}
.btn-redo{padding:14px;background:white;color:#2d6a4f;border:1.5px solid #d8f3dc;border-radius:15px;font-size:14px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;}
</style>
</head>
<body>

<!-- v3.0 -->
<!-- INTRO -->
<div id="intro" class="screen active">
  <svg class="i-bg" viewBox="0 0 400 750" fill="none">
    <circle cx="380" cy="20" r="220" stroke="rgba(116,198,157,0.06)" stroke-width="1"/>
    <circle cx="380" cy="20" r="160" stroke="rgba(116,198,157,0.05)" stroke-width="1"/>
    <circle cx="20" cy="730" r="260" stroke="rgba(116,198,157,0.05)" stroke-width="1"/>
  </svg>
  <div class="i-eyebrow">16人格 · 心智觉醒深度测试</div>
  <h1 class="i-title">你处于哪个<br>心智觉醒阶段？</h1>
  <p class="i-sub">先确认你的人格类型<br>再用32道专属题目精准诊断<br>你当前的心智进化位置</p>
  <div class="i-stage-row">
    <div class="i-stage is-0">未觉醒<span class="i-stage-lbl">被本能驱动</span></div>
    <div class="i-stage is-1">低阶<span class="i-stage-lbl">开始察觉</span></div>
    <div class="i-stage is-2">中阶<span class="i-stage-lbl">有意识选择</span></div>
    <div class="i-stage is-3">高阶<span class="i-stage-lbl">整合自我</span></div>
  </div>
  <button class="btn-go" onclick="showScreen('typesel')">开始测试</button>
  <p class="i-note">32题 · AI深度解读 · 64种专属结果</p>
</div>

<!-- TYPE SELECT -->
<div id="typesel" class="screen">
  <div class="tsel-head">
    <div class="tsel-title">第一步：选择你的人格类型</div>
    <div class="tsel-sub">不确定？建议先完成标准MBTI测试再来</div>
  </div>
  <div class="tsel-body">
    <div class="tgrp">
      <div class="tgrp-label">分析家 · NT</div>
      <div class="tgrid">
        <button class="tbtn" onclick="selTypeBtn('INTJ',this)">INTJ<small>建筑师</small></button>
        <button class="tbtn" onclick="selTypeBtn('INTP',this)">INTP<small>逻辑学家</small></button>
        <button class="tbtn" onclick="selTypeBtn('ENTJ',this)">ENTJ<small>指挥官</small></button>
        <button class="tbtn" onclick="selTypeBtn('ENTP',this)">ENTP<small>辩论家</small></button>
      </div>
    </div>
    <div class="tgrp">
      <div class="tgrp-label">外交家 · NF</div>
      <div class="tgrid">
        <button class="tbtn" onclick="selTypeBtn('INFJ',this)">INFJ<small>提倡者</small></button>
        <button class="tbtn" onclick="selTypeBtn('INFP',this)">INFP<small>调停者</small></button>
        <button class="tbtn" onclick="selTypeBtn('ENFJ',this)">ENFJ<small>主人公</small></button>
        <button class="tbtn" onclick="selTypeBtn('ENFP',this)">ENFP<small>竞选者</small></button>
      </div>
    </div>
    <div class="tgrp">
      <div class="tgrp-label">守卫者 · SJ</div>
      <div class="tgrid">
        <button class="tbtn" onclick="selTypeBtn('ISTJ',this)">ISTJ<small>物流师</small></button>
        <button class="tbtn" onclick="selTypeBtn('ISFJ',this)">ISFJ<small>守护者</small></button>
        <button class="tbtn" onclick="selTypeBtn('ESTJ',this)">ESTJ<small>总经理</small></button>
        <button class="tbtn" onclick="selTypeBtn('ESFJ',this)">ESFJ<small>执政官</small></button>
      </div>
    </div>
    <div class="tgrp">
      <div class="tgrp-label">探险家 · SP</div>
      <div class="tgrid">
        <button class="tbtn" onclick="selTypeBtn('ISTP',this)">ISTP<small>鉴赏家</small></button>
        <button class="tbtn" onclick="selTypeBtn('ISFP',this)">ISFP<small>探险家</small></button>
        <button class="tbtn" onclick="selTypeBtn('ESTP',this)">ESTP<small>企业家</small></button>
        <button class="tbtn" onclick="selTypeBtn('ESFP',this)">ESFP<small>表演者</small></button>
      </div>
    </div>
  </div>
  <div style="height:90px"></div>
  <div class="tconfirm">
    <div class="tsel-show" id="tShow"></div>
    <button class="btn-confirm" id="confirmBtn" onclick="startQuiz()">确认并开始测试</button>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="qbar">
    <div class="qbar-row">
      <span class="qprog" id="qProg">1 / 32</span>
      <span class="qskip" onclick="skipQ()">跳过演示</span>
    </div>
    <div class="ptrack"><div class="pfill" id="pfill" style="width:3%"></div></div>
    <span class="qdtag" id="dtag">维度加载中</span>
  </div>
  <div class="qbody">
    <div class="qserial" id="qSerial">问题 01</div>
    <div class="qtext" id="qText"></div>
    <div class="opts" id="opts"></div>
  </div>
</div>

<!-- LOADING -->
<div id="loading" class="screen">
  <div class="lorb">🧠</div>
  <div class="ltitle">正在生成专属报告…</div>
  <div class="lsub">结合你的类型与答题数据<br>AI 正在深度解读你的心智阶段</div>
  <div class="lsteps">
    <div class="lstep" id="ls1"><div class="ldot"></div>识别认知功能模式</div>
    <div class="lstep" id="ls2"><div class="ldot"></div>计算8维心智能量</div>
    <div class="lstep" id="ls3"><div class="ldot"></div>匹配觉醒阶段</div>
    <div class="lstep" id="ls4"><div class="ldot"></div>生成成长行动卡</div>
    <div class="lstep" id="ls5"><div class="ldot"></div>AI 个性化解读</div>
  </div>

const SM = [4,3,2,1];
let chosenType = null, dimScores = [], curQ = 0;

/* ═══════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// Fix: rename to avoid collision
function selTypeBtn(type, btn){ chosenType=type; document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); const td=TYPES[type]; document.getElementById('tShow').textContent='已选择：'+type+' · '+td.name; document.getElementById('confirmBtn').classList.add('on'); }

function startQuiz(){
  if(!chosenType) return;
  dimScores = new Array(8).fill(0);
  curQ = 0;
  showScreen('quiz');
  renderQ();
}

function renderQ(){
  const q = QS[curQ];
  document.getElementById('qProg').textContent=(curQ+1)+' / '+QS.length;
  document.getElementById('pfill').style.width=((curQ+1)/QS.length*100)+'%';
  document.getElementById('dtag').textContent='维度：'+DN[q.d];
  document.getElementById('qSerial').textContent='问题 '+String(curQ+1).padStart(2,'0');
  document.getElementById('qText').textContent=q.t;
  const letters=['A','B','C','D'];
  const opts=document.getElementById('opts');
  opts.innerHTML='';
  q.o.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.innerHTML='<span class="odot">'+letters[i]+'</span><span>'+o+'</span>';
    btn.onclick=()=>pickOpt(i,btn,q.d);
    opts.appendChild(btn);
  });
}

function pickOpt(idx,btn,dim){
  document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  dimScores[dim]+=SM[idx];
  setTimeout(()=>{ curQ++; if(curQ>=QS.length) doLoading(); else renderQ(); },230);
}

function skipQ(){
  for(let i=curQ;i<QS.length;i++) dimScores[QS[i].d]+=SM[Math.floor(Math.random()*3)];
  doLoading();
}

function doLoading(){
  showScreen('loading');
  [1,2,3,4,5].forEach((n,i)=>setTimeout(()=>document.getElementById('ls'+n).classList.add('done'),600*(i+1)));
  setTimeout(genReport,500);
}

   REPORT GENERATION
═══════════════════════════════════════════════ */
async function genReport(){
  const norm = dimScores.map(s=>Math.round((s/16)*100));
  const td = TYPES[chosenType];
  const weighted = norm.map((s,i)=>s*(td.radarW[i]||1));
  const total = weighted.reduce((a,b)=>a+b,0)/8;
  const si = total<45?0:total<62?1:total<78?2:3;
  const sb = STAGE_BASE[si];
  const scoreDisp = Math.min(990,Math.max(100,Math.round(total*10)+550));

  // AI prompt
  const dimStr = DN.map((n,i)=>n+':'+norm[i]).join('、');
  const maxI = norm.indexOf(Math.max(...norm));
  const minI = norm.indexOf(Math.min(...norm));
  const prompt = '你是一位深刻的MBTI分析师，语言有温度有力度，让人感到被真正看见。\n\n被测者：'+chosenType+' · '+td.name+'\n心智阶段：'+sb.name+'\n8维评分：'+dimStr+'\n最强：'+DN[maxI]+'('+norm[maxI]+')，最需成长：'+DN[minI]+'('+norm[minI]+')\n\n请写一段120字左右的专属洞察：\n1. 第一句直接切入，让人感到"它怎么这么懂我"\n2. 指出这个阶段最核心的内心张力\n3. 最后给一个让人想立刻去做的具体行动\n4. 不用标题，一气呵成，像真正了解你的朋友在说话';

  let aiText = '';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:prompt}]})});
    const data = await res.json();
    aiText = data.content?.[0]?.text||'';
  } catch(e) {
    aiText = chosenType+'在'+sb.name+'阶段，意味着你已经开始认识自己，但还没有完全和解。你的'+DN[maxI]+'已经是你的礼物；而你的'+DN[minI]+'正在等你去接它。今天试着问自己：如果我只为自己而存在一小时，我会做什么？';
  }

  await new Promise(r=>setTimeout(r,3200));
  renderReport(norm, scoreDisp, si, sb, td, aiText);
}

/* ═══════════════════════════════════════════════
   SHARE / SCREENSHOT
═══════════════════════════════════════════════ */
async function doShare(){
  const btn = document.querySelector('.btn-share');
  const orig = btn.textContent;
  btn.textContent = '生成中，请稍候…';
  btn.disabled = true;
  try {
    window.scrollTo(0,0);
    await new Promise(r=>setTimeout(r,300));
    const target = document.getElementById('rInner');
    const canvas = await html2canvas(target,{
      scale:2, useCORS:true, allowTaint:true,
      backgroundColor:'#eff8ef', scrollX:0, scrollY:0,
      windowWidth:document.documentElement.scrollWidth,
      windowHeight:target.scrollHeight, logging:false,
    });
    canvas.toBlob(async(blob)=>{
      const file = new File([blob],'MBTI心智阶段报告.png',{type:'image/png'});
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file],title:'16人格心智阶段测试报告',text:'#MBTI #心智觉醒 #16人格 #风在云巅'}); btn.textContent=orig; btn.disabled=false; return; }catch(e){}
      }
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='MBTI心智阶段报告.png';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
      btn.textContent='✓ 图片已保存！去相册发小红书吧';
      setTimeout(()=>{ btn.textContent=orig; btn.disabled=false; },3500);
    },'image/png');
  } catch(e){
    btn.textContent='请手动截屏保存';
    setTimeout(()=>{ btn.textContent=orig; btn.disabled=false; },3000);
  }
}


</script>
